[package]
name = "ojp"
description = "OpenJarvisProject desktop app (Linux)."
version.workspace = true
edition.workspace = true

# Installed command is `openjarvis` (the crate keeps the short name).
[[bin]]
name = "openjarvis"
path = "src/main.rs"

[features]
default = ["vulkan", "tts"]
# GPU offload via Vulkan. Build with --no-default-features for CPU-only
# (e.g. the aarch64 laptop build).
vulkan = ["ojp-core/vulkan"]
tts = ["ojp-core/tts"]
# Developer tools: `ui-test` drives the real app logic headlessly, `ui-shot` renders pages to PNG files.
uitest = ["dep:i-slint-backend-testing"]
shots = ["slint/software-renderer-systemfonts", "dep:png"]

[[bin]]
name = "ui-test"
path = "src/bin/ui-test.rs"
required-features = ["uitest"]

[[bin]]
name = "ui-shot"
path = "src/bin/ui-shot.rs"
required-features = ["shots"]

[dependencies]
ojp-core.workspace = true
anyhow.workspace = true
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "renderer-software"] }

# Load fontconfig at runtime instead of linking it, so the app can be
# cross-compiled (e.g. for aarch64 Debian) without a target sysroot.
# Feature-unifies with Slint's own fontique dependency.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

i-slint-backend-testing = { version = "=1.18.1", optional = true }
png = { version = "0.17", optional = true }

[build-dependencies]
slint-build.workspace = true
