[package]
name = "ojp"
description = "OpenJarvisProject desktop app (Linux)."
version.workspace = true
edition.workspace = true

# Installed command is `openjarvis` (the crate keeps the short name).
[[bin]]
name = "openjarvis"
path = "src/main.rs"

[features]
default = ["vulkan"]
# GPU offload via Vulkan. Build with --no-default-features for CPU-only
# (e.g. the aarch64 laptop build).
vulkan = ["ojp-core/vulkan"]

[dependencies]
ojp-core.workspace = true
anyhow.workspace = true
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "renderer-software"] }

# Load fontconfig at runtime instead of linking it, so the app can be
# cross-compiled (e.g. for aarch64 Debian) without a target sysroot.
# Feature-unifies with Slint's own fontique dependency.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build.workspace = true
