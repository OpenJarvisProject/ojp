[workspace]
resolver = "3"
members = ["ojp-core", "ojp", "ojp-android"]

[workspace.package]
version = "0.0.7"
edition = "2024"

[workspace.dependencies]
ojp-core = { path = "ojp-core" }
anyhow = "1"
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
slint-build = "1.18"

[profile.release]
strip = true

# Patched Slint crates: see vendor/OJP-PATCHES.md
[patch.crates-io]
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
i-slint-core = { path = "vendor/i-slint-core" }
llama-crab-sys = { path = "vendor/llama-crab-sys" }
llama-crab = { path = "vendor/llama-crab" }
