[workspace]
resolver = "3"
members = ["ojp-core", "ojp", "ojp-android"]

[workspace.package]
version = "0.0.2"
edition = "2024"

[workspace.dependencies]
ojp-core = { path = "ojp-core" }
anyhow = "1"
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
slint-build = "1.18"

[profile.release]
strip = true

# Patched Slint Android backend: see vendor/i-slint-backend-android-activity/OJP-PATCH.md
[patch.crates-io]
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
