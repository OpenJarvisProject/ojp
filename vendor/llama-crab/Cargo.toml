[package]
edition = "2021"
rust-version = "1.88"
name = "llama-crab"
version = "0.1.8"
authors = ["llama-crab contributors"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Safe, ergonomic and complete Rust bindings for llama.cpp"
homepage = "https://llama-crab.nlp.rocks/"
readme = "README.md"
keywords = [
    "llama",
    "llm",
    "inference",
    "gguf",
    "ai",
]
categories = [
    "api-bindings",
    "science",
]
license = "MIT"
repository = "https://github.com/DominguesM/llama-crab"

[package.metadata.docs.rs]
features = [
    "openmp",
    "mtmd",
]
no-default-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
common = ["llama-crab-sys/common"]
cuda = ["llama-crab-sys/cuda"]
cuda-no-vmm = ["llama-crab-sys/cuda-no-vmm"]
default = [
    "openmp",
    "metal",
]
disk-cache = ["dep:sled"]
dynamic-backends = ["llama-crab-sys/dynamic-backends"]
dynamic-link = ["llama-crab-sys/dynamic-link"]
hf-hub = ["dep:hf-hub"]
hf-tokenizer = ["dep:tokenizers"]
kleidiai = ["llama-crab-sys/kleidiai"]
llguidance = [
    "llama-crab-sys/llguidance",
    "dep:llguidance_lib",
    "dep:toktrie",
]
metal = ["llama-crab-sys/metal"]
mtmd = [
    "llama-crab-sys/mtmd",
    "dep:image",
    "dep:base64",
]
opencl = ["llama-crab-sys/opencl"]
openmp = ["llama-crab-sys/openmp"]
rocm = ["llama-crab-sys/rocm"]
shared-stdcxx = ["llama-crab-sys/shared-stdcxx"]
static-stdcxx = ["llama-crab-sys/static-stdcxx"]
system-ggml = ["llama-crab-sys/system-ggml"]
vulkan = ["llama-crab-sys/vulkan"]

[lib]
name = "llama_crab"
path = "src/lib.rs"

[[test]]
name = "gemma4_text"
path = "tests/gemma4_text.rs"

[[test]]
name = "gemma4_vision"
path = "tests/gemma4_vision.rs"
required-features = ["mtmd"]

[[test]]
name = "lfm_vl_vision"
path = "tests/lfm_vl_vision.rs"
required-features = ["mtmd"]

[[test]]
name = "hf_download"
path = "tests/hf_download.rs"
required-features = ["hf-hub"]

[[test]]
name = "embedding_regression"
path = "tests/embedding_regression.rs"

[[test]]
name = "rerank_api"
path = "tests/rerank_api.rs"

[[test]]
name = "infill_api"
path = "tests/infill_api.rs"

[[test]]
name = "streaming_api"
path = "tests/streaming_api.rs"

[dependencies.base64]
version = "0.22"
optional = true

[dependencies.bitflags]
version = "2"
features = ["serde"]

[dependencies.encoding_rs]
version = "0.8"

[dependencies.half]
version = "2"
features = ["serde"]

[dependencies.hf-hub]
version = "0.5"
optional = true

[dependencies.image]
version = "0.25"
optional = true

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dependencies.llama-crab-sys]
version = "0.1.8"
default-features = false

[dependencies.llguidance_lib]
version = "1.7"
optional = true
package = "llguidance"

[dependencies.parking_lot]
version = "0.12"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sled]
version = "0.34"
optional = true

[dependencies.smallvec]
version = "1"
features = ["union"]

[dependencies.thiserror]
version = "2"

[dependencies.tokenizers]
version = "0.23"
features = [
    "http",
    "onig",
]
optional = true
default-features = false

[dependencies.toktrie]
version = "1.7"
optional = true
package = "toktrie"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-core]
version = "0.1"

[dev-dependencies.cargo-llvm-cov]
version = "0.8"

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
match_wild_err_arm = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
